name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    name: Publish stable release
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Validate release tag and main ancestry
        run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci
      - name: Run release checks and publish with provenance
        # prepublishOnly runs release:check before npm uploads the package.
        run: npm publish --provenance
